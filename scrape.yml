name: 게임잡 채용공고 수집

on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch: {}

# UTC 00:00 = 한국시간 09:00. GitHub 대기열에 따라 시작이 지연될 수 있습니다.
concurrency:
  group: gamejob-monthly-collection
  cancel-in-progress: false

env:
  TZ: Asia/Seoul

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 필요한 패키지 설치
        run: pip install -r requirements.txt

      - name: 채용공고 수집 실행
        run: python gamejob_tracker.py --run

      - name: 결과 커밋 & 푸시
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "월초 채용공고 자동 수집"
          file_pattern: "data/**"
